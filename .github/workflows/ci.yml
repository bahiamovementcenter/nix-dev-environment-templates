name: Run checks and Determinate CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      templates:
        description: Templates to check, separated by spaces (leave empty for all of them)
        required: false
        default: ""
  # Every template, weekly: the only automatic full run
  schedule:
    - cron: "41 3 * * 1"
  push:
    branches:
      - main
    tags:
      - v?[0-9]+.[0-9]+.[0-9]+*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lockfile and formatting
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/flake-checker-action@main
        with:
          fail-mode: true
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Check formatting
        run: nix develop --command check-formatting

  # Checking a template builds its whole dev shell, so pull requests and
  # pushes check only the templates they change. Every template is checked
  # weekly, on tags, and on manual runs that don't name templates.
  changes:
    name: Find templates to check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      templates: ${{ steps.find.outputs.templates }}
      organist: ${{ steps.find.outputs.organist }}
      agents: ${{ steps.find.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUSH_BEFORE: ${{ github.event.before }}
          REQUESTED: ${{ inputs.templates }}
        run: |
          all_templates() {
            for dir in */; do
              if [ -f "${dir}flake.nix" ]; then
                printf '%s\n' "${dir%/}"
              fi
            done
          }

          changed_templates() {
            local changed
            changed="$(git diff --name-only "$1")"
            cut -d / -f 1 <<<"$changed" | sort -u | while read -r dir; do
              if [ -f "$dir/flake.nix" ]; then
                printf '%s\n' "$dir"
              fi
            done
            # The root flake.nix (check script, template list) and this
            # workflow affect how every template is checked, so a change to
            # either runs the check on the smallest template. The root
            # flake.lock needs nothing: templates resolve their own Nixpkgs.
            if grep -qxE 'flake\.nix|\.github/workflows/ci\.yml' <<<"$changed"; then
              echo empty
            fi
          }

          if [ "$EVENT" = workflow_dispatch ] && [ -n "$REQUESTED" ]; then
            templates="$(tr ' ' '\n' <<<"$REQUESTED")"
          elif [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ "$REF_TYPE" = tag ]; then
            templates="$(all_templates)"
          elif [ "$EVENT" = pull_request ]; then
            # A pull request is checked out merged into the current base
            # branch, its first parent. The event's base SHA can be older
            # than that, which would count changes already on main.
            templates="$(changed_templates "HEAD^1..HEAD")"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            templates="$(changed_templates "$PUSH_BEFORE..HEAD")"
          else
            # A push whose previous commit isn't known (a new branch)
            templates="$(changed_templates "HEAD^..HEAD")"
          fi
          templates="$(sort -u <<<"$templates")"

          # The Organist parity check compares organist/ with the templates it
          # was ported from, against the Nixpkgs in the root flake.lock, so it
          # runs when any of those (or this workflow) change, and on full runs
          range=""
          if [ "$EVENT" = pull_request ]; then
            range="HEAD^1..HEAD"
          elif [ "$EVENT" = push ] && [ "$REF_TYPE" != tag ]; then
            if [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE..HEAD"
            else
              range="HEAD^..HEAD"
            fi
          fi
          organist=true
          if [ -n "$range" ]; then
            originals="$(jq -r '.templates[].original' organist/parity.json | paste -sd '|')"
            if ! git diff --name-only "$range" | grep -qE "^(organist|$originals)/|^(flake\.lock|\.github/workflows/ci\.yml)$"; then
              organist=false
            fi
          fi
          echo "organist=$organist" >> "$GITHUB_OUTPUT"

          # The agents template (AGENTS.md, Agent Skills, Claude Code settings)
          # has no flake.nix, so it's checked by check-agents, not the matrix
          agents=true
          if [ -n "$range" ] && ! git diff --name-only "$range" | grep -qE "^agents/|^(flake\.nix|\.github/workflows/ci\.yml)$"; then
            agents=false
          fi
          echo "agents=$agents" >> "$GITHUB_OUTPUT"

          echo "Templates to check: $(tr '\n' ' ' <<<"$templates")"
          echo "templates=$(jq -Rnc '[inputs | select(length > 0)]' <<<"$templates")" >> "$GITHUB_OUTPUT"

  templates:
    name: Check ${{ matrix.template }}
    needs: changes
    if: needs.changes.outputs.templates != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.changes.outputs.templates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Flake check
        env:
          TEMPLATE: ${{ matrix.template }}
        run: nix develop --command check "$TEMPLATE"

  organist:
    name: Organist templates match their originals
    needs: changes
    if: needs.changes.outputs.organist == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Parity check
        # Organist imports Nix expressions it generates during evaluation;
        # Determinate Nix's lazy trees leave the derivations they refer to
        # unwritten ("path …-regenerate-files.drv is not valid"). See the
        # note in the README's Organist section.
        env:
          NIX_CONFIG: lazy-trees = false
        run: nix develop --command check-organist

  agents:
    name: Agent conventions are valid
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Check skills, settings and the skills symlink
        run: nix develop --command check-agents

  determinate-ci:
    needs:
      - check
      - templates
      - organist
      - agents
    # Also run when the matrix or another check was skipped
    if: ${{ !failure() && !cancelled() }}
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      visibility: public
