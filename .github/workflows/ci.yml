name: Run checks and Determinate CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v?[0-9]+.[0-9]+.[0-9]+*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lockfile and formatting
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/flake-checker-action@main
        with:
          fail-mode: true
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Check formatting
        run: nix develop --command check-formatting

  # Checking a template builds its whole dev shell, so pull requests check
  # only the templates they change; pushes and manual runs check them all
  changes:
    name: Find templates to check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      templates: ${{ steps.find.outputs.templates }}
      organist: ${{ steps.find.outputs.organist }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all_templates() {
            for dir in */; do
              if [ -f "${dir}flake.nix" ]; then
                printf '%s\n' "${dir%/}"
              fi
            done
          }

          if [ "$EVENT" != pull_request ]; then
            templates="$(all_templates)"
          else
            changed="$(git diff --name-only "$BASE...HEAD")"
            if grep -qx '\.github/workflows/ci\.yml' <<<"$changed"; then
              # A change to this workflow is tested on every template
              templates="$(all_templates)"
            else
              templates="$(cut -d / -f 1 <<<"$changed" | sort -u | while read -r dir; do
                if [ -f "$dir/flake.nix" ]; then
                  printf '%s\n' "$dir"
                fi
              done)"
              # The root flake.nix holds the check script (and the template
              # list every new template edits), so a change there runs the
              # script on the smallest template too. The root flake.lock
              # needs nothing: templates resolve their own Nixpkgs.
              if grep -qx 'flake\.nix' <<<"$changed"; then
                templates="$(printf '%s\nempty\n' "$templates" | sort -u)"
              fi
            fi
          fi

          # The Organist parity check compares organist/ with the templates it
          # was ported from, against the Nixpkgs in the root flake.lock
          organist=true
          if [ "$EVENT" = pull_request ]; then
            originals="$(jq -r '.templates[].original' organist/parity.json | paste -sd '|')"
            if ! grep -qE "^(organist|$originals)/|^(flake\.lock|\.github/workflows/ci\.yml)$" <<<"$changed"; then
              organist=false
            fi
          fi
          echo "organist=$organist" >> "$GITHUB_OUTPUT"

          echo "Templates to check: $(tr '\n' ' ' <<<"$templates")"
          echo "templates=$(jq -Rnc '[inputs | select(length > 0)]' <<<"$templates")" >> "$GITHUB_OUTPUT"

  templates:
    name: Check ${{ matrix.template }}
    needs: changes
    if: needs.changes.outputs.templates != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.changes.outputs.templates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Flake check
        env:
          TEMPLATE: ${{ matrix.template }}
        run: nix develop --command check "$TEMPLATE"

  organist:
    name: Organist templates match their originals
    needs: changes
    if: needs.changes.outputs.organist == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@main
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Parity check
        run: nix develop --command check-organist

  determinate-ci:
    needs:
      - check
      - templates
      - organist
    # Also run when the matrix or the parity check was skipped
    if: ${{ !failure() && !cancelled() }}
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      visibility: public
